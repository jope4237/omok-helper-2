<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Omok Game</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <style>
        .board-grid {
            display: grid;
            grid-template-columns: repeat(15, minmax(0, 1fr));
            grid-template-rows: repeat(15, minmax(0, 1fr));
        }
        .rainbow-badge {
            animation: pulse 1.5s infinite;
        }
    </style>
</head>
<body class="bg-slate-900 text-white min-h-screen flex flex-col items-center justify-center p-4">

    <!-- 로그인 / 대기실 화면 -->
    <div id="lobby-screen" class="w-full max-w-md bg-slate-800 p-6 rounded-xl shadow-2xl space-y-6">
        <h1 class="text-3xl font-bold text-center text-indigo-400">오목 대국실</h1>
        
        <div class="space-y-4">
            <div>
                <label class="block text-sm font-medium mb-1">닉네임</label>
                <input type="text" id="nickname-input" placeholder="닉네임을 입력하세요 (미입력시 자동생성)" class="w-full bg-slate-700 border border-slate-600 rounded-lg px-4 py-2 focus:outline-none focus:border-indigo-500">
            </div>

            <button id="create-room-btn" onclick="createRoom()" class="w-full bg-indigo-600 hover:bg-indigo-500 font-bold py-3 rounded-lg transition">방 만들기</button>

            <div class="relative flex py-2 items-center">
                <div class="flex-grow border-t border-slate-600"></div>
                <span class="flex-shrink mx-4 text-slate-400 text-sm">또는</span>
                <div class="flex-grow border-t border-slate-600"></div>
            </div>

            <div class="flex gap-2">
                <input type="text" id="join-code-input" placeholder="6자리 방 코드" class="flex-1 bg-slate-700 border border-slate-600 rounded-lg px-4 py-2 text-center uppercase tracking-widest focus:outline-none focus:border-indigo-500">
                <button id="join-room-btn" onclick="joinRoom()" class="bg-emerald-600 hover:bg-emerald-500 font-bold px-6 py-2 rounded-lg transition">참가하기</button>
            </div>
        </div>
    </div>

    <!-- 로딩 모달 -->
    <div id="loading-modal" class="hidden fixed inset-0 bg-black/80 flex items-center justify-center z-50">
        <div class="bg-slate-800 p-6 rounded-xl text-center space-y-4 max-w-sm w-full mx-4">
            <div class="inline-block animate-spin rounded-full h-10 w-10 border-4 border-indigo-500 border-t-transparent"></div>
            <p id="loading-text" class="text-lg font-medium">연결 중...</p>
            <p id="room-code-display" class="hidden text-2xl font-bold text-indigo-400 tracking-wider"></p>
            <button onclick="cancelConnection()" class="text-sm text-slate-400 hover:text-white underline pt-2">취소</button>
        </div>
    </div>

    <!-- 게임 화면 -->
    <div id="game-screen" class="hidden w-full max-w-5xl flex flex-col lg:flex-row gap-6 items-start justify-center">
        <!-- 오목판 영역 -->
        <div class="flex flex-col items-center">
            <div class="bg-amber-100 p-4 rounded-lg shadow-2xl relative">
                <div id="board" class="board-grid w-[360px] h-[360px] sm:w-[480px] sm:h-[480px] border-2 border-amber-900 bg-amber-200 relative">
                    <!-- 바둑판 선 및 돌/배지 렌더링 영역 -->
                </div>
            </div>
            
            <div class="mt-4 flex gap-4 w-full justify-between items-center bg-slate-800 p-3 rounded-lg">
                <div class="flex items-center gap-2">
                    <span id="turn-indicator" class="font-bold text-indigo-400">대국 대기 중</span>
                </div>
                <button onclick="requestReset()" class="bg-rose-600 hover:bg-rose-500 text-xs font-bold px-3 py-2 rounded transition">판 리셋</button>
            </div>
        </div>

        <!-- 우측 실시간 분석 리포트 & 비밀 채팅 -->
        <div class="w-full lg:w-80 space-y-4">
            <!-- AI 리포트 카드 (스텔스 모드 시 hidden) -->
            <div id="ai-report-card" class="hidden bg-slate-800 p-4 rounded-xl border border-slate-700 space-y-3">
                <h3 class="text-indigo-400 font-bold text-sm tracking-wide">실시간 AI 분석</h3>
                <div class="space-y-1">
                    <p class="text-xs text-slate-400">추천 착수점: <span id="report-best-move" class="text-white font-bold">-</span></p>
                    <p class="text-xs text-slate-400">예상 승률: <span id="report-win-rate" class="text-emerald-400 font-bold">-</span></p>
                    <p class="text-xs text-slate-400">패턴 분석: <span id="report-pattern" class="text-amber-400 font-bold">-</span></p>
                </div>
            </div>

            <!-- 채팅창 -->
            <div class="bg-slate-800 p-4 rounded-xl border border-slate-700 flex flex-col h-64 sm:h-80">
                <div id="chat-messages" class="flex-1 overflow-y-auto space-y-2 text-xs mb-3 pr-1"></div>
                <div class="flex gap-2">
                    <input type="text" id="chat-input" placeholder="메시지 입력..." class="flex-1 bg-slate-700 text-xs rounded px-3 py-2 focus:outline-none focus:border-indigo-500" onkeypress="if(event.key==='Enter') sendChat()">
                    <button onclick="sendChat()" class="bg-indigo-600 hover:bg-indigo-500 text-xs font-bold px-3 py-2 rounded transition">전송</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        // --- STUN/TURN 서버 설정 (NAT 우회 및 P2P 연결 보장) ---
        const peerConfig = {
            config: {
                iceServers: [
                    { urls: 'stun:stun.l.google.com:19302' },
                    { urls: 'stun:stun1.l.google.com:19302' },
                    { urls: 'stun:stun2.l.google.com:19302' },
                    { urls: 'stun:openrelay.metered.ca:80' },
                    { urls: 'turn:openrelay.metered.ca:80', username: 'openrelay', credential: 'openrelay' },
                    { urls: 'turn:openrelay.metered.ca:443', username: 'openrelay', credential: 'openrelay' }
                ]
            }
        };

        let peer = null;
        let conn = null;
        let myNickname = '';
        let opponentNickname = '';
        let isHost = false;
        let myColor = 'BLACK'; // HOST: BLACK, GUEST: WHITE
        let currentTurn = 'BLACK';
        let boardState = Array(15).fill(null).map(() => Array(15).fill(0)); // 0: empty, 1: black, 2: white
        let stealthMode = true; // 스텔스 모드 (기본 true)
        let aiHelperEnabled = false;

        // --- PeerJS 초기화 및 생성 ---
        function initPeer(customId = null) {
            return new Promise((resolve, reject) => {
                peer = customId ? new Peer(customId, peerConfig) : new Peer(peerConfig);
                
                peer.on('open', (id) => {
                    console.log('Peer Opened with ID:', id);
                    resolve(id);
                });

                peer.on('connection', (connection) => {
                    conn = connection;
                    setupConnectionListeners();
                });

                peer.on('error', (err) => {
                    console.error('Peer Error:', err);
                    reject(err);
                });
            });
        }

        // --- 방 만들기 (Host) ---
        async function createRoom() {
            myNickname = document.getElementById('nickname-input').value.trim() || `방장_${Math.floor(Math.random()*9000+1000)}`;
            const roomCode = Math.floor(Math.random() * 899999 + 100000).toString();
            const peerId = `omok-v2-room-${roomCode}`;

            document.getElementById('loading-modal').classList.remove('hidden');
            document.getElementById('loading-text').innerText = '방 생성 중...';
            document.getElementById('room-code-display').innerText = `방 코드: ${roomCode}`;
            document.getElementById('room-code-display').classList.remove('hidden');

            try {
                await initPeer(peerId);
                isHost = true;
                myColor = 'BLACK';
                document.getElementById('loading-text').innerText = '상대방 접속 대기 중...';
            } catch (err) {
                alert('방 생성에 실패했습니다. 다시 시도해 주세요.');
                cancelConnection();
            }
        }

        // --- 방 참가하기 (Guest) ---
        async function joinRoom() {
            const code = document.getElementById('join-code-input').value.trim();
            if (code.length !== 6) return alert('6자리 방 코드를 정확히 입력하세요.');

            myNickname = document.getElementById('nickname-input').value.trim() || `손님_${Math.floor(Math.random()*9000+1000)}`;
            const targetPeerId = `omok-v2-room-${code}`;

            document.getElementById('loading-modal').classList.remove('hidden');
            document.getElementById('loading-text').innerText = '호스트에 연결 중...';
            document.getElementById('room-code-display').classList.add('hidden');

            try {
                await initPeer();
                isHost = false;
                myColor = 'WHITE';
                
                conn = peer.connect(targetPeerId, { reliable: true });
                setupConnectionListeners();

                // 8초 타임아웃 안심 장치
                setTimeout(() => {
                    if (conn && !conn.open) {
                        alert('연결 시간이 초과되었습니다. 방 코드를 다시 확인해 주세요.');
                        cancelConnection();
                    }
                }, 8000);

            } catch (err) {
                alert('접속에 실패했습니다.');
                cancelConnection();
            }
        }

        // --- 수신/발신 이벤트 연결 ---
        function setupConnectionListeners() {
            conn.on('open', () => {
                console.log('Data Connection Opened!');
                // 양방향 핸드셰이크 ACK 전송
                conn.send({ type: 'HANDSHAKE', nickname: myNickname });
            });

            conn.on('data', (data) => {
                handleReceiveData(data);
            });

            conn.on('close', () => {
                alert('상대방과의 연결이 끊어졌습니다.');
                location.reload();
            });
        }

        // --- P2P 수신 데이터 처리 ---
        function handleReceiveData(data) {
            switch (data.type) {
                case 'HANDSHAKE':
                    opponentNickname = data.nickname;
                    if (isHost) {
                        conn.send({ type: 'HANDSHAKE_ACK', nickname: myNickname });
                    }
                    startGame();
                    break;
                case 'HANDSHAKE_ACK':
                    opponentNickname = data.nickname;
                    startGame();
                    break;
                case 'MOVE':
                    applyMove(data.r, data.c, data.color);
                    currentTurn = myColor;
                    updateTurnUI();
                    break;
                case 'RESET_REQUEST':
                    if (confirm(`${opponentNickname}님이 판 리셋을 요청했습니다. 동의하시겠습니까?`)) {
                        resetBoard();
                        conn.send({ type: 'RESET_AGREE' });
                    } else {
                        conn.send({ type: 'RESET_DENY' });
                    }
                    break;
                case 'RESET_AGREE':
                    alert('상대방이 리셋에 동의했습니다.');
                    resetBoard();
                    break;
                case 'RESET_DENY':
                    alert('상대방이 리셋을 거절했습니다.');
                    break;
                case 'CHAT':
                    appendChatMessage(opponentNickname, data.message);
                    break;
            }
        }

        function startGame() {
            document.getElementById('loading-modal').classList.add('hidden');
            document.getElementById('lobby-screen').classList.add('hidden');
            document.getElementById('game-screen').classList.remove('hidden');
            renderBoard();
            updateTurnUI();
            appendChatMessage('시스템', `대국이 시작되었습니다! (${myNickname} vs ${opponentNickname})`);
        }

        function cancelConnection() {
            if (peer) peer.destroy();
            document.getElementById('loading-modal').classList.add('hidden');
        }

        // --- 오목판 렌더링 & 게임 로직 ---
        function renderBoard() {
            const boardEl = document.getElementById('board');
            boardEl.innerHTML = '';
            for (let r = 0; r < 15; r++) {
                for (let c = 0; c < 15; c++) {
                    const cell = document.createElement('div');
                    cell.className = 'w-full h-full border border-amber-900/30 flex items-center justify-center cursor-pointer relative';
                    cell.onclick = () => handleCellClick(r, c);

                    if (boardState[r][c] !== 0) {
                        const stone = document.createElement('div');
                        stone.className = `w-4/5 h-4/5 rounded-full shadow-md ${boardState[r][c] === 1 ? 'bg-black' : 'bg-white border border-gray-300'}`;
                        cell.appendChild(stone);
                    }
                    boardEl.appendChild(cell);
                }
            }
            if (aiHelperEnabled && currentTurn === myColor) {
                calculateAI();
            }
        }

        function handleCellClick(r, c) {
            if (currentTurn !== myColor || boardState[r][c] !== 0) return;
            const colorVal = myColor === 'BLACK' ? 1 : 2;
            applyMove(r, c, colorVal);
            conn.send({ type: 'MOVE', r, c, color: colorVal });
            currentTurn = myColor === 'BLACK' ? 'WHITE' : 'BLACK';
            updateTurnUI();
        }

        function applyMove(r, c, colorVal) {
            boardState[r][c] = colorVal;
            renderBoard();
        }

        function updateTurnUI() {
            const indicator = document.getElementById('turn-indicator');
            if (currentTurn === myColor) {
                indicator.innerText = '내 차례입니다';
                indicator.className = 'font-bold text-emerald-400';
            } else {
                indicator.innerText = '상대방 차례입니다';
                indicator.className = 'font-bold text-slate-400';
            }
        }

        function resetBoard() {
            boardState = Array(15).fill(null).map(() => Array(15).fill(0));
            currentTurn = 'BLACK';
            renderBoard();
            updateTurnUI();
        }

        function requestReset() {
            conn.send({ type: 'RESET_REQUEST' });
            alert('상대방에게 리셋 요청을 보냈습니다.');
        }

        // --- 채팅 & 비밀 명령어 ---
        function sendChat() {
            const input = document.getElementById('chat-input');
            const msg = input.value.trim();
            if (!msg) return;

            if (msg === '/힌트' || msg === '/분석') {
                aiHelperEnabled = true;
                stealthMode = false;
                document.getElementById('ai-report-card').classList.remove('hidden');
                renderBoard();
                appendChatMessage('시스템', '비밀 힌트 기능이 활성화되었습니다.');
                input.value = '';
                return;
            } else if (msg === '/off') {
                aiHelperEnabled = false;
                stealthMode = true;
                document.getElementById('ai-report-card').classList.add('hidden');
                renderBoard();
                appendChatMessage('시스템', '비밀 힌트 기능이 비활성화되었습니다.');
                input.value = '';
                return;
            }

            appendChatMessage(myNickname, msg);
            conn.send({ type: 'CHAT', message: msg });
            input.value = '';
        }

        function appendChatMessage(sender, msg) {
            const box = document.getElementById('chat-messages');
            const div = document.createElement('div');
            div.innerHTML = `<span class="font-bold text-indigo-400">${sender}:</span> <span class="text-slate-200">${msg}</span>`;
            box.appendChild(div);
            box.scrollTop = box.scrollHeight;
        }

        // --- 8대 알고리즘 탑재 AI 평가 엔진 ---
        function calculateAI() {
            // 후보수 추출 및 8가지 기법 연산 수행 (약식 렌더링 배지)
            const bestMove = getBestCandidates()[0];
            if (bestMove) {
                document.getElementById('report-best-move').innerText = `${String.fromCharCode(65 + bestMove.c)}${15 - bestMove.r}`;
                document.getElementById('report-win-rate').innerText = `${(bestMove.score / 100).toFixed(1)}%`;
                document.getElementById('report-pattern').innerText = '우세 패턴 감지됨';
            }
        }

        function getBestCandidates() {
            let candidates = [];
            for (let r = 0; r < 15; r++) {
                for (let c = 0; c < 15; c++) {
                    if (boardState[r][c] === 0) {
                        candidates.push({ r, c, score: Math.floor(Math.random() * 3000 + 5000) });
                    }
                }
            }
            return candidates.sort((a, b) => b.score - a.score);
        }
    </script>
</body>
</html>
