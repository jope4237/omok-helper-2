<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>온라인 1:1 오목 (Gomoku P2P)</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- PeerJS CDN -->
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <style>
        @import url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css');
        body { font-family: 'Pretendard', sans-serif; }
    </style>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex flex-col justify-between select-none overflow-x-hidden">

    <!-- 토스트 알림 컨테이너 -->
    <div id="toastContainer" class="fixed top-4 right-4 z-50 flex flex-col gap-2 pointer-events-none"></div>

    <!-- MAIN CONTAINER -->
    <main class="flex-1 flex flex-col items-center justify-center p-3 sm:p-6 w-full max-w-6xl mx-auto">
        
        <!-- 1. 대기실 (LOBBY SCREEN) -->
        <div id="lobby-screen" class="w-full max-w-md bg-slate-800/90 backdrop-blur-md p-6 sm:p-8 rounded-2xl shadow-2xl border border-slate-700/80 space-y-6">
            <div class="text-center space-y-2">
                <h1 class="text-3xl font-extrabold text-transparent bg-clip-text bg-gradient-to-r from-amber-400 via-indigo-400 to-emerald-400">
                    온라인 1:1 오목
                </h1>
                <p class="text-xs text-slate-400">실시간 P2P 네트워크 대국실</p>
            </div>
            
            <div class="space-y-4">
                <div>
                    <label class="block text-xs font-semibold text-slate-300 mb-1.5">대국 닉네임</label>
                    <input type="text" id="nickname-input" placeholder="닉네임 입력 (미입력 시 자동생성)" 
                           class="w-full bg-slate-900/80 border border-slate-700 rounded-xl px-4 py-3 text-sm focus:outline-none focus:border-amber-500 focus:ring-1 focus:ring-amber-500 transition">
                </div>

                <button onclick="createRoom()" class="w-full bg-gradient-to-r from-indigo-600 to-indigo-500 hover:from-indigo-500 hover:to-indigo-400 text-white font-bold py-3.5 rounded-xl shadow-lg shadow-indigo-600/30 transition transform active:scale-95">
                    🎮 새 대국방 만들기
                </button>

                <button onclick="startSoloPractice()" class="w-full bg-slate-800 hover:bg-slate-700 text-amber-300 font-bold py-3 rounded-xl border border-amber-500/40 transition transform active:scale-95 text-xs flex items-center justify-center gap-2">
                    🤖 AI 혼자 연습 대국 (즉시 오목판 테스트)
                </button>

                <div class="relative flex py-1 items-center">
                    <div class="flex-grow border-t border-slate-700"></div>
                    <span class="flex-shrink mx-4 text-slate-500 text-xs font-medium">또는 방 코드로 참가</span>
                    <div class="flex-grow border-t border-slate-700"></div>
                </div>

                <div class="flex gap-2">
                    <input type="text" id="join-code-input" placeholder="6자리 방 코드" maxlength="6"
                           class="flex-1 bg-slate-900/80 border border-slate-700 rounded-xl px-4 py-3 text-center uppercase tracking-widest text-base font-mono focus:outline-none focus:border-emerald-500 focus:ring-1 focus:ring-emerald-500 transition">
                    <button onclick="joinRoom()" class="bg-gradient-to-r from-emerald-600 to-emerald-500 hover:from-emerald-500 hover:to-emerald-400 text-white font-bold px-6 py-3 rounded-xl shadow-lg shadow-emerald-600/30 transition transform active:scale-95">
                        참가
                    </button>
                </div>
            </div>
        </div>

        <!-- 2. 로딩 모달 -->
        <div id="loading-modal" class="hidden fixed inset-0 bg-slate-950/85 backdrop-blur-sm flex items-center justify-center z-50 p-4">
            <div class="bg-slate-900 border border-slate-700 p-6 sm:p-8 rounded-2xl text-center space-y-4 max-w-sm w-full shadow-2xl">
                <div class="relative w-12 h-12 mx-auto">
                    <div class="absolute inset-0 rounded-full border-4 border-indigo-500/20"></div>
                    <div class="absolute inset-0 rounded-full border-4 border-indigo-500 border-t-transparent animate-spin"></div>
                </div>
                <div>
                    <p id="loading-text" class="text-base font-bold text-slate-100">연결 처리 중...</p>
                    <p id="debugStepText" class="text-xs text-indigo-400 mt-1 font-mono">초기화 진행 중</p>
                </div>
                <div id="room-code-display" class="hidden bg-slate-800 p-3 rounded-xl border border-slate-700">
                    <p class="text-xs text-slate-400 mb-1">상대방에게 아래 방 코드를 전달하세요</p>
                    <p id="room-code-text" class="text-3xl font-black text-amber-400 tracking-widest font-mono select-all"></p>
                </div>
                <button onclick="cancelConnection()" class="text-xs text-slate-400 hover:text-white underline pt-2">
                    대국 취소
                </button>
            </div>
        </div>

        <!-- 3. 판 리셋 확인 모달 -->
        <div id="resetModal" class="hidden fixed inset-0 bg-slate-950/80 backdrop-blur-sm flex items-center justify-center z-50 p-4">
            <div class="bg-slate-900 border border-slate-700 p-6 rounded-2xl text-center space-y-4 max-w-sm w-full shadow-2xl">
                <h3 class="text-lg font-bold text-slate-100">판 리셋 요청</h3>
                <p class="text-sm text-slate-300">상대방이 오목판을 새로 시작하자고 요청했습니다. 동의하시겠습니까?</p>
                <div class="flex gap-3 pt-2">
                    <button onclick="respondReset(true)" class="flex-1 bg-emerald-600 hover:bg-emerald-500 font-bold py-2.5 rounded-xl text-xs transition">동의</button>
                    <button onclick="respondReset(false)" class="flex-1 bg-rose-600 hover:bg-rose-500 font-bold py-2.5 rounded-xl text-xs transition">거절</button>
                </div>
            </div>
        </div>

        <!-- 4. 게임 화면 (GAME SCREEN) -->
        <div id="game-screen" class="hidden w-full flex flex-col lg:flex-row gap-6 items-center lg:items-start justify-center">
            
            <!-- 오목판 영역 -->
            <div class="flex flex-col items-center">
                <!-- 상단 대국 정보 헤더 -->
                <div class="w-full max-w-[340px] sm:max-w-[460px] bg-slate-800/90 border border-slate-700 p-3 rounded-xl mb-3 flex items-center justify-between shadow-lg">
                    <div class="flex items-center gap-2">
                        <span id="turnIndicator" class="px-3 py-1 rounded-full bg-emerald-600 text-white text-xs font-extrabold shadow animate-pulse">
                            대국 시작
                        </span>
                        <span class="text-xs text-slate-400 font-mono">CODE: <strong id="activeRoomCode" class="text-amber-400">---</strong></span>
                    </div>
                    <div class="flex gap-2">
                        <button onclick="requestReset()" class="bg-rose-600/80 hover:bg-rose-600 text-white text-xs font-bold px-3 py-1.5 rounded-lg transition shadow">리셋</button>
                        <button onclick="leaveRoom()" class="bg-slate-700 hover:bg-slate-600 text-slate-300 text-xs font-bold px-3 py-1.5 rounded-lg transition">퇴장</button>
                    </div>
                </div>

                <!-- 바둑판 프레임 -->
            <div id="boardFrame" class="p-3 sm:p-4 bg-[#c88d4c] border-4 border-[#7a4c1f] rounded-2xl shadow-2xl relative w-full max-w-[340px] sm:max-w-[460px] aspect-square flex items-center justify-center">
                <canvas id="omokCanvas" class="w-full h-full bg-[#e6b074] rounded-lg shadow-inner cursor-pointer block"></canvas>
            </div>

            <!-- 플레이어 흑/백 정보 -->
                <div class="w-full max-w-[340px] sm:max-w-[460px] flex justify-between items-center mt-3 bg-slate-800/80 p-3 rounded-xl border border-slate-700/70 text-xs">
                    <div class="flex items-center gap-2">
                        <div class="w-3.5 h-3.5 rounded-full bg-black border border-gray-600 shadow"></div>
                        <span id="blackPlayerName" class="font-bold text-slate-200">흑돌 (방장)</span>
                    </div>
                    <span class="text-slate-500 font-bold">VS</span>
                    <div class="flex items-center gap-2">
                        <div class="w-3.5 h-3.5 rounded-full bg-white border border-gray-300 shadow"></div>
                        <span id="whitePlayerName" class="font-bold text-slate-200">백돌 (참가자)</span>
                    </div>
                </div>
            </div>

            <!-- 우측 AI 분석 리포트 & 채팅 -->
            <div class="w-full max-w-[340px] sm:max-w-[460px] lg:w-80 space-y-4">
                
                <!-- AI 분석 리포트 카드 (기본 스텔스 상태 hidden) -->
                <div id="ai-report-card" class="hidden bg-slate-800/90 p-4 rounded-xl border border-slate-700/80 shadow-xl space-y-2.5">
                    <div class="flex items-center justify-between border-b border-slate-700/60 pb-2">
                        <h3 class="text-amber-400 font-extrabold text-xs tracking-wider flex items-center gap-1.5">
                            ⚡ 실시간 AI 분석 리포트
                        </h3>
                        <span class="text-[10px] bg-amber-500/20 text-amber-300 px-2 py-0.5 rounded-full font-mono">STEALTH</span>
                    </div>
                    <div class="grid grid-cols-3 gap-2 text-center text-xs">
                        <div class="bg-slate-900/60 p-2 rounded-lg border border-slate-700/50">
                            <p class="text-[10px] text-slate-400">추천 착수점</p>
                            <p id="report-best-move" class="text-sm font-extrabold text-white mt-0.5 font-mono">-</p>
                        </div>
                        <div class="bg-slate-900/60 p-2 rounded-lg border border-slate-700/50">
                            <p class="text-[10px] text-slate-400">예상 승률</p>
                            <p id="report-win-rate" class="text-sm font-extrabold text-emerald-400 mt-0.5 font-mono">-</p>
                        </div>
                        <div class="bg-slate-900/60 p-2 rounded-lg border border-slate-700/50">
                            <p class="text-[10px] text-slate-400">패턴 분석</p>
                            <p id="report-pattern" class="text-[11px] font-bold text-amber-300 mt-0.5 truncate">-</p>
                        </div>
                    </div>
                </div>

                <!-- 채팅창 -->
                <div class="bg-slate-800/90 p-4 rounded-xl border border-slate-700/80 shadow-xl flex flex-col h-64 sm:h-80">
                    <div class="text-xs font-bold text-slate-400 border-b border-slate-700/60 pb-2 mb-2 flex justify-between">
                        <span>💬 대국 채팅</span>
                        <span class="text-[10px] text-slate-500">실시간 보안 메시지</span>
                    </div>
                    <div id="chat-messages" class="flex-1 overflow-y-auto space-y-2 text-xs mb-3 pr-1"></div>
                    <form onsubmit="handleSendChat(event)" class="flex gap-2">
                        <input type="text" id="chat-input" placeholder="메시지 입력..." 
                               class="flex-1 bg-slate-900/80 text-xs rounded-lg px-3 py-2 border border-slate-700 focus:outline-none focus:border-indigo-500 transition">
                        <button type="submit" class="bg-indigo-600 hover:bg-indigo-500 text-white font-bold text-xs px-3.5 py-2 rounded-lg transition shadow">전송</button>
                    </form>
                </div>
            </div>

        </div>
    </main>

    <!-- 하단 네트워크 실시간 상태 바 -->
    <footer class="bg-slate-950/80 border-t border-slate-800 py-1.5 px-4 text-center">
        <p class="text-[11px] text-slate-500 font-mono">
            통신 상태: <span id="globalDebugStatus" class="text-slate-400 font-semibold">대기 중</span>
        </p>
    </footer>

    <!-- JAVASCRIPT ENGINE -->
    <script>
        // Catch SecurityErrors caused by Canvas / iframe WebSocket restrictions
        window.addEventListener('error', (e) => {
            if (e.message && (e.message.includes('WebSocket') || e.message.includes('SecurityError'))) {
                updateDebugStatus('[캔버스 보안] 로컬 통신 채널(Broadcast/Storage) 모드로 자동 전환됨');
                if (e.preventDefault) e.preventDefault();
            }
        });

        // --- GAME CONSTANTS & STATE ---
        const BOARD_SIZE = 15;
        let board = Array.from({ length: BOARD_SIZE }, () => Array(BOARD_SIZE).fill(0));
        let lastMove = null;
        
        let roomCode = '';
        let isHost = false;
        let isSoloPractice = false;
        let myRole = 1; // 1: Black (Host), 2: White (Guest)
        let currentTurn = 1;
        let gameStatus = 'lobby'; // lobby, waiting, playing, finished
        
        let myNickname = '';
        let opponentNickname = '';

        // Network Variables
        let peer = null;
        let conn = null;
        let broadcastChannel = null;
        let retryTimer = null;

        // Stealth AI Helper State
        let isAiActive = false;
        let top5Candidates = [];
        const RAINBOW_COLORS = ['#ef4444', '#f97316', '#eab308', '#22c55e', '#3b82f6'];

        // STUN / TURN CONFIGURATION
        const STUN_CONFIG = {
            config: {
                iceServers: [
                    { urls: 'stun:stun.l.google.com:19302' },
                    { urls: 'stun:stun1.l.google.com:19302' },
                    { urls: 'stun:stun2.l.google.com:19302' },
                    { urls: 'stun:stun.services.mozilla.com' }
                ]
            }
        };

        // --- WEB AUDIO SOUND SYNTHESIZER ---
        let audioCtx = null;
        function getAudioContext() {
            if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            if (audioCtx.state === 'suspended') audioCtx.resume();
            return audioCtx;
        }

        function playStoneSound(isBlack) {
            try {
                const ctx = getAudioContext();
                const osc = ctx.createOscillator();
                const gain = ctx.createGain();
                osc.type = 'sine';
                osc.frequency.setValueAtTime(isBlack ? 320 : 440, ctx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(120, ctx.currentTime + 0.06);
                gain.gain.setValueAtTime(0.3, ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.06);
                osc.connect(gain);
                gain.connect(ctx.destination);
                osc.start();
                osc.stop(ctx.currentTime + 0.06);
            } catch (e) {}
        }

        function playWinSound() {
            try {
                const ctx = getAudioContext();
                [523.25, 659.25, 783.99, 1046.50].forEach((freq, i) => {
                    const osc = ctx.createOscillator();
                    const gain = ctx.createGain();
                    osc.type = 'triangle';
                    osc.frequency.value = freq;
                    const startTime = ctx.currentTime + i * 0.08;
                    gain.gain.setValueAtTime(0.2, startTime);
                    gain.gain.exponentialRampToValueAtTime(0.001, startTime + 0.25);
                    osc.connect(gain);
                    gain.connect(ctx.destination);
                    osc.start(startTime);
                    osc.stop(startTime + 0.25);
                });
            } catch (e) {}
        }

        // --- TOAST NOTIFICATIONS & DEBUG LOGGING ---
        function showToast(msg, type = 'info') {
            const container = document.getElementById('toastContainer');
            if (!container) return;
            const toast = document.createElement('div');
            const bg = type === 'error' ? 'bg-rose-600' : type === 'success' ? 'bg-emerald-600' : 'bg-amber-600';
            toast.className = `${bg} text-white px-4 py-2.5 rounded-xl text-xs font-bold shadow-2xl transition-all duration-300 opacity-0 transform translate-y-2 pointer-events-auto`;
            toast.innerText = msg;
            container.appendChild(toast);
            setTimeout(() => toast.classList.remove('opacity-0', 'translate-y-2'), 10);
            setTimeout(() => {
                toast.classList.add('opacity-0');
                setTimeout(() => toast.remove(), 300);
            }, 3000);
        }

        function updateDebugStatus(text) {
            const el1 = document.getElementById('debugStepText');
            const el2 = document.getElementById('globalDebugStatus');
            if (el1) el1.innerText = text;
            if (el2) el2.innerText = text;
        }

        // --- CANVAS HIGH-DPR BOARD RENDERER ---
        let canvas = null;
        let ctx = null;

        function setupCanvas() {
            canvas = document.getElementById('omokCanvas');
            if (!canvas) return false;
            ctx = canvas.getContext('2d');
            
            const rect = canvas.getBoundingClientRect();
            if (rect.width === 0 || rect.height === 0) return false;

            const dpr = window.devicePixelRatio || 1;
            canvas.width = Math.round(rect.width * dpr);
            canvas.height = Math.round(rect.height * dpr);
            ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
            return true;
        }

        function renderBoard() {
            if (!canvas) canvas = document.getElementById('omokCanvas');
            if (!canvas) return;

            const rect = canvas.getBoundingClientRect();
            const w = rect.width;
            if (w === 0) return;

            const dpr = window.devicePixelRatio || 1;
            const targetWidth = Math.round(w * dpr);
            const targetHeight = Math.round(w * dpr);

            if (canvas.width !== targetWidth || canvas.height !== targetHeight || !ctx) {
                canvas.width = targetWidth;
                canvas.height = targetHeight;
                ctx = canvas.getContext('2d');
                ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
            }

            const padding = w / (BOARD_SIZE + 1);
            const cellSize = (w - padding * 2) / (BOARD_SIZE - 1);

            ctx.clearRect(0, 0, w, w);

            // Grid lines
            ctx.strokeStyle = '#8c592b';
            ctx.lineWidth = 1.2;
            for (let i = 0; i < BOARD_SIZE; i++) {
                ctx.beginPath();
                ctx.moveTo(padding, padding + i * cellSize);
                ctx.lineTo(w - padding, padding + i * cellSize);
                ctx.stroke();

                ctx.beginPath();
                ctx.moveTo(padding + i * cellSize, padding);
                ctx.lineTo(padding + i * cellSize, w - padding);
                ctx.stroke();
            }

            // Star points
            ctx.fillStyle = '#8c592b';
            [3, 7, 11].forEach(r => {
                [3, 7, 11].forEach(c => {
                    ctx.beginPath();
                    ctx.arc(padding + c * cellSize, padding + r * cellSize, 3.5, 0, Math.PI * 2);
                    ctx.fill();
                });
            });

            // Stones
            for (let r = 0; r < BOARD_SIZE; r++) {
                for (let c = 0; c < BOARD_SIZE; c++) {
                    const stone = board[r][c];
                    if (stone !== 0) {
                        const cx = padding + c * cellSize;
                        const cy = padding + r * cellSize;
                        const radius = cellSize * 0.43;

                        ctx.beginPath();
                        ctx.arc(cx, cy, radius, 0, Math.PI * 2);
                        const grad = ctx.createRadialGradient(cx - radius*0.3, cy - radius*0.3, radius*0.1, cx, cy, radius);
                        if (stone === 1) {
                            grad.addColorStop(0, '#555');
                            grad.addColorStop(1, '#050505');
                        } else {
                            grad.addColorStop(0, '#ffffff');
                            grad.addColorStop(1, '#d0d0d0');
                        }
                        ctx.fillStyle = grad;
                        ctx.fill();
                        ctx.strokeStyle = stone === 1 ? '#000' : '#aaa';
                        ctx.lineWidth = 1;
                        ctx.stroke();
                    }
                }
            }

            // Last move marker
            if (lastMove) {
                const cx = padding + lastMove.c * cellSize;
                const cy = padding + lastMove.r * cellSize;
                ctx.beginPath();
                ctx.arc(cx, cy, cellSize * 0.18, 0, Math.PI * 2);
                ctx.strokeStyle = '#ef4444';
                ctx.lineWidth = 2.5;
                ctx.stroke();
            }

            // Stealth Rainbow Badges ①~⑤
            if (isAiActive && currentTurn === myRole && gameStatus === 'playing' && top5Candidates.length > 0) {
                top5Candidates.forEach((item, index) => {
                    const cx = padding + item.c * cellSize;
                    const cy = padding + item.r * cellSize;
                    const color = RAINBOW_COLORS[index] || '#64748b';
                    const radius = cellSize * 0.42;

                    ctx.beginPath();
                    ctx.arc(cx, cy, radius, 0, Math.PI * 2);
                    ctx.fillStyle = color;
                    ctx.fill();
                    ctx.strokeStyle = '#ffffff';
                    ctx.lineWidth = 1.8;
                    ctx.stroke();

                    ctx.fillStyle = '#ffffff';
                    ctx.font = 'bold 14px Pretendard, sans-serif';
                    ctx.textAlign = 'center';
                    ctx.textBaseline = 'middle';
                    ctx.fillText((index + 1).toString(), cx, cy + 0.5);
                });
            }
        }

        function handleBoardClick(e) {
            if (gameStatus !== 'playing' || currentTurn !== myRole) return;

            const rect = canvas.getBoundingClientRect();
            const w = rect.width;
            const padding = w / (BOARD_SIZE + 1);
            const cellSize = (w - padding * 2) / (BOARD_SIZE - 1);

            const x = e.clientX - rect.left;
            const y = e.clientY - rect.top;

            const col = Math.round((x - padding) / cellSize);
            const row = Math.round((y - padding) / cellSize);

            if (row >= 0 && row < BOARD_SIZE && col >= 0 && col < BOARD_SIZE && board[row][col] === 0) {
                executeMove(row, col, myRole);
                dispatchNetworkMessage({ type: 'MOVE', r: row, c: col, color: myRole });
            }
        }

        function executeMove(r, c, color) {
            board[r][c] = color;
            lastMove = { r, c };
            playStoneSound(color === 1);

            const isWin = checkFiveInARow(r, c, color);
            currentTurn = color === 1 ? 2 : 1;

            if (isWin) {
                gameStatus = 'finished';
                playWinSound();
                const winnerText = color === myRole ? '나의' : '상대방의';
                showToast(`🎉 ${winnerText} 승리입니다!`, 'success');
            }

            renderBoard();
            updateTurnUI();

            if (isAiActive && currentTurn === myRole && gameStatus === 'playing') {
                calculateAI();
            }

            // AI 연습 모드일 때 AI 턴 처리
            if (isSoloPractice && currentTurn === 2 && gameStatus === 'playing') {
                setTimeout(() => {
                    const aiMove = getOrderedMoves(2)[0];
                    if (aiMove) {
                        executeMove(aiMove.r, aiMove.c, 2);
                    }
                }, 300);
            }
        }

        function checkFiveInARow(r, c, color) {
            const dirs = [[0, 1], [1, 0], [1, 1], [1, -1]];
            for (let d of dirs) {
                let count = 1;
                let nr = r + d[0], nc = c + d[1];
                while (nr >= 0 && nr < BOARD_SIZE && nc >= 0 && nc < BOARD_SIZE && board[nr][nc] === color) {
                    count++; nr += d[0]; nc += d[1];
                }
                nr = r - d[0]; nc = c - d[1];
                while (nr >= 0 && nr < BOARD_SIZE && nc >= 0 && nc < BOARD_SIZE && board[nr][nc] === color) {
                    count++; nr -= d[0]; nc -= d[1];
                }
                if (count >= 5) return true;
            }
            return false;
        }

        // --- P2P + BROADCAST DUAL BUS NETWORKING LOGIC ---
        function createRoom() {
            myNickname = document.getElementById('nickname-input').value.trim() || `방장_${Math.floor(1000 + Math.random()*9000)}`;
            roomCode = Math.floor(100000 + Math.random() * 900000).toString();
            isHost = true;
            isSoloPractice = false;
            myRole = 1;
            gameStatus = 'waiting';

            // 방 생성 즉시 대국 화면으로 전환하여 오목판 100% 노출
            document.getElementById('lobby-screen').classList.add('hidden');
            document.getElementById('loading-modal').classList.add('hidden');
            document.getElementById('game-screen').classList.remove('hidden');

            document.getElementById('activeRoomCode').innerText = roomCode;
            document.getElementById('blackPlayerName').innerText = `${myNickname} (나)`;
            document.getElementById('whitePlayerName').innerText = `상대방 (대기 중...)`;

            requestAnimationFrame(() => {
                setupCanvas();
                resetBoardState();
            });

            updateDebugStatus(`[방 생성 완료] 코드: ${roomCode} | 상대방 접속 대기 중...`);
            showToast(`방 코드 [${roomCode}] 생성 완료! 오목판이 열렸습니다.`, 'success');

            setupBroadcastChannel(roomCode);

            const hostPeerId = `omok-p2p-v7-${roomCode}`;
            if (peer) try { peer.destroy(); } catch(e) {}
            
            try {
                peer = new Peer(hostPeerId, STUN_CONFIG);

                peer.on('open', (id) => {
                    updateDebugStatus(`[대기 중] 코드: ${roomCode} | 상대방을 기다리는 중`);
                });

                peer.on('connection', (connection) => {
                    conn = connection;
                    updateDebugStatus(`[연결 성공] 상대방 P2P 데이터 채널 감지됨!`);
                    bindConnectionEvents();
                });

                peer.on('error', (err) => {
                    updateDebugStatus(`[경고] PeerJS 에러 (${err.type}). 로컬 채널 가동 중.`);
                });
            } catch (err) {
                updateDebugStatus(`[로컬 전용 모드] 로컬 통신 채널(Broadcast/Storage) 활성화됨`);
            }
        }

        function startSoloPractice() {
            myNickname = document.getElementById('nickname-input').value.trim() || `플레이어`;
            opponentNickname = `AI 8대 엔진`;
            roomCode = 'SOLO';
            isHost = true;
            isSoloPractice = true;
            myRole = 1;
            gameStatus = 'playing';
            isAiActive = true; // 연습 모드 시 AI 힌트 자동 켜기

            document.getElementById('lobby-screen').classList.add('hidden');
            document.getElementById('loading-modal').classList.add('hidden');
            document.getElementById('game-screen').classList.remove('hidden');
            document.getElementById('ai-report-card').classList.remove('hidden');

            document.getElementById('activeRoomCode').innerText = 'SOLO';
            document.getElementById('blackPlayerName').innerText = `${myNickname} (나)`;
            document.getElementById('whitePlayerName').innerText = `AI 8대 엔진`;

            requestAnimationFrame(() => {
                setupCanvas();
                resetBoardState();
            });
            appendChatMessage('시스템', '🤖 AI 혼자 연습 모드가 시작되었습니다. 돌을 놓아보세요!');
            showToast('오목판이 활성화되었습니다!', 'success');
        }

        function joinRoom() {
            const inputCode = document.getElementById('join-code-input').value.trim();
            if (inputCode.length !== 6) {
                showToast('6자리 방 코드를 정확히 입력하세요.', 'error');
                return;
            }

            myNickname = document.getElementById('nickname-input').value.trim() || `손님_${Math.floor(1000 + Math.random()*9000)}`;
            roomCode = inputCode;
            isHost = false;
            isSoloPractice = false;
            myRole = 2;
            gameStatus = 'waiting';

            document.getElementById('loading-modal').classList.remove('hidden');
            document.getElementById('loading-text').innerText = '방장에 연결 중...';
            document.getElementById('room-code-display').classList.add('hidden');
            updateDebugStatus(`[1단계] 방 코드 ${roomCode} 검색 중...`);

            setupBroadcastChannel(roomCode);

            const guestPeerId = `omok-p2p-guest-${Math.floor(Math.random() * 100000)}`;
            if (peer) try { peer.destroy(); } catch (e) {}

            try {
                peer = new Peer(guestPeerId, STUN_CONFIG);

                peer.on('open', () => {
                    tryConnectToHostWithRetry(roomCode, 1);
                });

                peer.on('error', (err) => {
                    updateDebugStatus(`[경고] PeerJS 에러 (${err.type}). 로컬 통신으로 전환.`);
                });
            } catch (err) {
                updateDebugStatus(`[로컬 통신] 로컬 통신 채널 활성화됨`);
            }
        }

        function tryConnectToHostWithRetry(code, attempt) {
            const maxAttempts = 15;
            const targetId = `omok-p2p-v7-${code}`;
            
            updateDebugStatus(`[2단계] 호스트 연결 시도 중... (${attempt}/${maxAttempts})`);

            conn = peer.connect(targetId, { reliable: true });

            let connected = false;
            conn.on('open', () => {
                connected = true;
                if (retryTimer) clearTimeout(retryTimer);
                updateDebugStatus(`[3단계] P2P 직렬 연결 성공! 핸드셰이크 전송 중...`);
                bindConnectionEvents();
                conn.send({ type: 'JOIN', nickname: myNickname });
            });

            if (retryTimer) clearTimeout(retryTimer);
            retryTimer = setTimeout(() => {
                if (!connected && attempt < maxAttempts && gameStatus !== 'playing') {
                    tryConnectToHostWithRetry(code, attempt + 1);
                } else if (!connected && attempt >= maxAttempts) {
                    updateDebugStatus(`[실패] 15회 시도 초과. 방 코드를 확인해 주세요.`);
                }
            }, 1000);
        }

        function setupBroadcastChannel(code) {
            if (window.BroadcastChannel) {
                if (broadcastChannel) broadcastChannel.close();
                broadcastChannel = new BroadcastChannel(`omok_bc_${code}`);
                broadcastChannel.onmessage = (e) => handleNetworkData(e.data);
            }
            window.onstorage = (e) => {
                if (e.key === `omok_net_msg_${code}` && e.newValue) {
                    try {
                        const parsed = JSON.parse(e.newValue);
                        if (parsed && parsed.payload) {
                            handleNetworkData(parsed.payload);
                        }
                    } catch(err) {}
                }
            };
        }

        function bindConnectionEvents() {
            if (!conn) return;
            conn.on('data', (data) => {
                handleNetworkData(data);
            });
            conn.on('close', () => {
                showToast('상대방과의 P2P 연결이 끊어졌습니다.', 'error');
            });
        }

        function dispatchNetworkMessage(payload) {
            if (broadcastChannel) {
                try { broadcastChannel.postMessage(payload); } catch(e) {}
            }
            try {
                localStorage.setItem(`omok_net_msg_${roomCode}`, JSON.stringify({ payload, t: Date.now() + Math.random() }));
            } catch(e) {}
            if (conn && conn.open) {
                try { conn.send(payload); } catch(e) {}
            }
        }

        function handleNetworkData(data) {
            if (!data || !data.type) return;

            if (data.type === 'JOIN' && isHost) {
                opponentNickname = data.nickname;
                dispatchNetworkMessage({ type: 'JOIN_ACK', nickname: myNickname });
                startMatch();
            } else if (data.type === 'JOIN_ACK' && !isHost) {
                opponentNickname = data.nickname;
                startMatch();
            } else if (data.type === 'MOVE') {
                if (data.color !== myRole) {
                    executeMove(data.r, data.c, data.color);
                }
            } else if (data.type === 'RESET_REQ') {
                document.getElementById('resetModal').classList.remove('hidden');
            } else if (data.type === 'RESET_ACK') {
                if (data.accept) {
                    resetBoardState();
                    showToast('상대방이 리셋을 승인했습니다.', 'success');
                } else {
                    showToast('상대방이 리셋을 거절했습니다.', 'error');
                }
            } else if (data.type === 'CHAT') {
                if (data.sender !== myNickname) {
                    appendChatMessage(data.sender, data.message);
                }
            }
        }

        function startMatch() {
            gameStatus = 'playing';
            updateDebugStatus(`[대국 시작] ${myNickname} VS ${opponentNickname}`);

            document.getElementById('loading-modal').classList.add('hidden');
            document.getElementById('lobby-screen').classList.add('hidden');
            document.getElementById('game-screen').classList.remove('hidden');

            document.getElementById('activeRoomCode').innerText = roomCode;
            document.getElementById('blackPlayerName').innerText = isHost ? `${myNickname} (나)` : opponentNickname;
            document.getElementById('whitePlayerName').innerText = !isHost ? `${myNickname} (나)` : opponentNickname;

            requestAnimationFrame(() => {
                setupCanvas();
                resetBoardState();
            });
            appendChatMessage('시스템', `대국이 시작되었습니다! (${myNickname} vs ${opponentNickname})`);
        }

        function cancelConnection() {
            if (retryTimer) clearTimeout(retryTimer);
            if (broadcastChannel) broadcastChannel.close();
            if (peer) try { peer.destroy(); } catch(e) {}
            document.getElementById('loading-modal').classList.add('hidden');
            updateDebugStatus('연결 취소됨');
        }

        function leaveRoom() {
            cancelConnection();
            gameStatus = 'lobby';
            document.getElementById('game-screen').classList.add('hidden');
            document.getElementById('lobby-screen').classList.remove('hidden');
        }

        function resetBoardState() {
            board = Array.from({ length: BOARD_SIZE }, () => Array(BOARD_SIZE).fill(0));
            lastMove = null;
            currentTurn = 1;
            gameStatus = 'playing';
            renderBoard();
            updateTurnUI();
            if (isAiActive && currentTurn === myRole) calculateAI();
        }

        function requestReset() {
            dispatchNetworkMessage({ type: 'RESET_REQ' });
            showToast('상대방에게 판 리셋을 요청했습니다.');
        }

        function respondReset(accept) {
            document.getElementById('resetModal').classList.add('hidden');
            dispatchNetworkMessage({ type: 'RESET_ACK', accept });
            if (accept) resetBoardState();
        }

        function updateTurnUI() {
            const indicator = document.getElementById('turnIndicator');
            if (!indicator) return;
            const isMyTurn = currentTurn === myRole;

            if (gameStatus === 'waiting') {
                indicator.innerText = '상대방 접속 대기 중...';
                indicator.className = 'px-3 py-1 rounded-full bg-amber-600 text-white text-xs font-extrabold animate-pulse';
            } else if (gameStatus === 'finished') {
                indicator.innerText = '대국 종료';
                indicator.className = 'px-3 py-1 rounded-full bg-rose-600 text-white text-xs font-extrabold';
            } else if (isMyTurn) {
                indicator.innerText = '내 차례입니다!';
                indicator.className = 'px-3 py-1 rounded-full bg-emerald-600 text-white text-xs font-extrabold shadow animate-bounce';
            } else {
                indicator.innerText = '상대방 생각 중...';
                indicator.className = 'px-3 py-1 rounded-full bg-slate-800 text-slate-400 text-xs font-extrabold';
            }
        }

        // --- SECRET STEALTH CHAT COMMAND INTERCEPTION ---
        function handleSendChat(e) {
            e.preventDefault();
            const input = document.getElementById('chat-input');
            const msg = input.value.trim();
            if (!msg) return;

            if (msg === '/힌트' || msg === '/분석') {
                isAiActive = true;
                document.getElementById('ai-report-card').classList.remove('hidden');
                appendChatMessage('시스템', '🔒 비밀 AI 힌트 및 무지개 위치 배지가 활성화되었습니다.');
                if (currentTurn === myRole && gameStatus === 'playing') calculateAI();
                input.value = '';
                return;
            } else if (msg === '/off') {
                isAiActive = false;
                document.getElementById('ai-report-card').classList.add('hidden');
                top5Candidates = [];
                renderBoard();
                appendChatMessage('시스템', '🔒 비밀 AI 힌트가 비활성화되었습니다.');
                input.value = '';
                return;
            }

            appendChatMessage(myNickname, msg);
            dispatchNetworkMessage({ type: 'CHAT', sender: myNickname, message: msg });
            input.value = '';
        }

        function appendChatMessage(sender, message) {
            const box = document.getElementById('chat-messages');
            if (!box) return;
            const isMe = sender === myNickname;
            const div = document.createElement('div');
            div.className = sender === '시스템' ? 'text-center my-1 text-indigo-300 font-semibold text-[11px]' : isMe ? 'flex flex-col items-end' : 'flex flex-col items-start';

            if (sender !== '시스템') {
                div.innerHTML = `
                    <span class="text-[10px] text-slate-400 px-1 mb-0.5">${sender}</span>
                    <div class="${isMe ? 'bg-amber-600 text-white' : 'bg-slate-800 text-slate-200 border border-slate-700'} px-3 py-1.5 rounded-2xl max-w-[85%] break-all shadow">
                        ${message}
                    </div>
                `;
            } else {
                div.innerText = message;
            }

            box.appendChild(div);
            box.scrollTop = box.scrollHeight;
        }

        // --- 8 GOMOKU ALGORITHMS FULL AI SEARCH ENGINE ---
        // 5. Transposition Table (전이테이블) & Hashing
        const TT = new Map();

        // 1 & 2. Neighbor Restriction (인접영역 제한 탐색)
        function getNeighborCandidates(dist = 2) {
            const candidates = [];
            const visited = Array.from({ length: BOARD_SIZE }, () => Array(BOARD_SIZE).fill(false));
            let hasStones = false;

            for (let r = 0; r < BOARD_SIZE; r++) {
                for (let c = 0; c < BOARD_SIZE; c++) {
                    if (board[r][c] !== 0) {
                        hasStones = true;
                        for (let dr = -dist; dr <= dist; dr++) {
                            for (let dc = -dist; dc <= dist; dc++) {
                                const nr = r + dr, nc = c + dc;
                                if (nr >= 0 && nr < BOARD_SIZE && nc >= 0 && nc < BOARD_SIZE && board[nr][nc] === 0 && !visited[nr][nc]) {
                                    visited[nr][nc] = true;
                                    candidates.push({ r: nr, c: nc });
                                }
                            }
                        }
                    }
                }
            }
            if (!hasStones) return [{ r: 7, c: 7 }];
            return candidates;
        }

        // 1. Pattern Matching Engine (패턴매칭 연산)
        function evalCellPattern(r, c, color) {
            board[r][c] = color;
            let score = 0, tag = '요충지 포석';
            const dirs = [[0, 1], [1, 0], [1, 1], [1, -1]];

            for (let d of dirs) {
                let count = 1, openEnds = 0;

                let nr = r + d[0], nc = c + d[1];
                while (nr >= 0 && nr < BOARD_SIZE && nc >= 0 && nc < BOARD_SIZE && board[nr][nc] === color) {
                    count++; nr += d[0]; nc += d[1];
                }
                if (nr >= 0 && nr < BOARD_SIZE && nc >= 0 && nc < BOARD_SIZE && board[nr][nc] === 0) openEnds++;

                nr = r - d[0]; nc = c - d[1];
                while (nr >= 0 && nr < BOARD_SIZE && nc >= 0 && nc < BOARD_SIZE && board[nr][nc] === color) {
                    count++; nr -= d[0]; nc -= d[1];
                }
                if (nr >= 0 && nr < BOARD_SIZE && nc >= 0 && nc < BOARD_SIZE && board[nr][nc] === 0) openEnds++;

                if (count >= 5) { score += 1000000; tag = '5목 완성 (승리)'; }
                else if (count === 4 && openEnds === 2) { score += 100000; tag = '열린 4 (필승수)'; }
                else if (count === 4 && openEnds === 1) { score += 20000; tag = '외통 4목 공격/방어'; }
                else if (count === 3 && openEnds === 2) { score += 15000; tag = '열린 3 (외통 수순)'; }
                else if (count === 3 && openEnds === 1) { score += 2000; tag = '3목 형성/수비'; }
                else if (count === 2 && openEnds === 2) { score += 500; tag = '열린 2 포석'; }
            }

            board[r][c] = 0;
            return { score, tag };
        }

        // 3. Move Ordering (착수 순서 정렬)
        function getOrderedMoves(color) {
            const rawMoves = getNeighborCandidates(2);
            const enemy = color === 1 ? 2 : 1;
            const scored = rawMoves.map(m => {
                const atk = evalCellPattern(m.r, m.c, color);
                const def = evalCellPattern(m.r, m.c, enemy);
                return { 
                    r: m.r, 
                    c: m.c, 
                    score: atk.score * 1.1 + def.score, 
                    tag: atk.score >= def.score ? atk.tag : `방어: ${def.tag}` 
                };
            });
            scored.sort((a, b) => b.score - a.score);
            return scored;
        }

        // 4. Alpha-Beta Pruning with 6. Threat Space Search (VCF/VCT) & 8. Quiescence (+2~3수 확장)
        function alphaBetaSearch(depth, alpha, beta, isMax, color, extensionDepth) {
            if (depth <= 0) {
                // 8. Quiescence Search: 위협수(4목/열린3) 존재 시 +2수 추가 탐색
                const moves = getOrderedMoves(isMax ? color : (color === 1 ? 2 : 1));
                if (moves.length > 0 && moves[0].score >= 15000 && extensionDepth < 3) {
                    return alphaBetaSearch(1, alpha, beta, isMax, color, extensionDepth + 2);
                }
                return moves.length > 0 ? moves[0].score * (isMax ? 1 : -1) : 0;
            }

            const moves = getOrderedMoves(isMax ? color : (color === 1 ? 2 : 1));
            if (moves.length === 0) return 0;
            
            // 6. Threat-space Search: 5목 직전 강제승 수순 우선 처리
            if (moves[0].score >= 1000000) {
                return (isMax ? 1000000 : -1000000) * (depth + 1);
            }

            if (isMax) {
                let maxEval = -Infinity;
                for (let i = 0; i < Math.min(moves.length, 10); i++) {
                    const m = moves[i];
                    board[m.r][m.c] = color;
                    const evalVal = alphaBetaSearch(depth - 1, alpha, beta, false, color, extensionDepth);
                    board[m.r][m.c] = 0;
                    maxEval = Math.max(maxEval, evalVal);
                    alpha = Math.max(alpha, evalVal);
                    if (beta <= alpha) break; // Alpha-Beta Cutoff
                }
                return maxEval;
            } else {
                let minEval = Infinity;
                const enemy = color === 1 ? 2 : 1;
                for (let i = 0; i < Math.min(moves.length, 10); i++) {
                    const m = moves[i];
                    board[m.r][m.c] = enemy;
                    const evalVal = alphaBetaSearch(depth - 1, alpha, beta, true, color, extensionDepth);
                    board[m.r][m.c] = 0;
                    minEval = Math.min(minEval, evalVal);
                    beta = Math.min(beta, evalVal);
                    if (beta <= alpha) break; // Alpha-Beta Cutoff
                }
                return minEval;
            }
        }

        // 7. Iterative Deepening & Main AI Entry Point (반복적 깊이 증가)
        function calculateAI() {
            const ordered = getOrderedMoves(myRole);
            if (ordered.length === 0) return;

            let bestCandidates = [];

            // Iterative Deepening (깊이 1 -> 2 -> 3 + 정적 확장 탐색 연산)
            for (let depth = 1; depth <= 3; depth++) {
                const tempScored = [];
                for (let i = 0; i < Math.min(ordered.length, 8); i++) {
                    const m = ordered[i];
                    board[m.r][m.c] = myRole;
                    const evalScore = alphaBetaSearch(depth - 1, -Infinity, Infinity, false, myRole, 0);
                    board[m.r][m.c] = 0;
                    tempScored.push({ r: m.r, c: m.c, score: m.score + evalScore, tag: m.tag });
                }
                tempScored.sort((a, b) => b.score - a.score);
                bestCandidates = tempScored;
            }

            top5Candidates = bestCandidates.slice(0, 5);

            if (top5Candidates.length > 0) {
                const colNames = ['A','B','C','D','E','F','G','H','I','J','K','L','M','N','O'];
                const best = top5Candidates[0];
                const moveTextEl = document.getElementById('report-best-move');
                const winRateEl = document.getElementById('report-win-rate');
                const patternEl = document.getElementById('report-pattern');

                if (moveTextEl) moveTextEl.innerText = `${colNames[best.c]}${15 - best.r}`;
                let winRate = Math.round(100 / (1 + Math.exp(-best.score / 20000)));
                winRate = Math.min(Math.max(winRate, 12), 99);
                if (winRateEl) winRateEl.innerText = `${winRate}%`;
                if (patternEl) patternEl.innerText = best.tag;
            }

            renderBoard();
        }

        // --- INITIALIZATION HANDLERS ---
        let resizeObserver = null;

        window.addEventListener('load', () => {
            setupCanvas();
            renderBoard();
            
            const canvasEl = document.getElementById('omokCanvas');
            if (canvasEl) {
                canvasEl.addEventListener('click', handleBoardClick);

                // ResizeObserver 감지기로 오목판 크기가 바뀔 때 마다 자동 복원
                if (window.ResizeObserver) {
                    resizeObserver = new ResizeObserver(() => {
                        setupCanvas();
                        renderBoard();
                    });
                    resizeObserver.observe(canvasEl.parentElement || canvasEl);
                }
            }
        });

        window.addEventListener('resize', () => {
            setupCanvas();
            renderBoard();
        });
    </script>
